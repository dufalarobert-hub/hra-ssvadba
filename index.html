<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1712">
<title>Dve úlohy</title>

<style>
  :root {
    --noc:      #0C1712;
    --noc-2:    #16261D;
    --mosadz:   #E8C25F;
    --papier:   #EFE9DA;
    --papier-2: #93A294;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--noc);
    color: var(--papier);
    font-family: var(--serif);
    display: grid;
    place-items: center;
    padding: 8vh 24px;
    overflow: hidden;
    /* biely kurzor s tmavým obrysom — viditeľný na tmavom pozadí */
    cursor: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='24'%20height='24'%3E%3Cpath%20d='M4%202L4%2019L8.5%2014.8L11.5%2021L13.8%2020L10.8%2014L16.5%2013.8Z'%20fill='%23ffffff'%20stroke='%23222222'%20stroke-width='1.3'%20stroke-linejoin='round'/%3E%3C/svg%3E") 3 2, auto;
  }

  .svetlo {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(58% 46% at 50% 42%, rgba(232, 194, 95, .12) 0%, rgba(232, 194, 95, .045) 42%, transparent 72%),
      radial-gradient(120% 90% at 50% 0%, #1B2E24 0%, var(--noc) 62%);
    animation: dychanie 9s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes dychanie {
    0%, 100% { opacity: .82; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.05); }
  }

  .zrno {
    position: fixed;
    inset: -50%;
    background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: .5;
    pointer-events: none;
    animation: chvenie 7s steps(6) infinite;
  }

  @keyframes chvenie {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-1%, 1%); }
    50%  { transform: translate(1%, -1%); }
    75%  { transform: translate(-1%, -1%); }
    100% { transform: translate(0, 0); }
  }

  .list {
    position: relative;
    z-index: 1;
    width: min(620px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(22px, 3.6vh, 36px);
  }

  .nadpis {
    font-size: clamp(34px, 7.6vw, 60px);
    line-height: 1.06;
    letter-spacing: -.015em;
    color: var(--mosadz);
    margin: 0;
    text-wrap: balance;
  }

  .veta {
    font-size: clamp(17px, 3.1vw, 22px);
    line-height: 1.66;
    margin: 0;
    text-wrap: balance;
    max-width: 27ch;
    color: var(--papier);
  }

  .veta.tichsia { color: var(--papier-2); font-size: clamp(15px, 2.7vw, 18px); }

  .caraz {
    width: 46px;
    height: 1px;
    background: rgba(232, 194, 95, .45);
  }

  .start {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--noc);
    background: var(--mosadz);
    border: none;
    border-radius: 2px;
    padding: 15px 34px;
    margin-top: 6px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }

  .start:hover { background: #F7DC93; }
  .start:active { transform: translateY(1px); }
  .start:focus-visible { outline: 2px solid var(--papier); outline-offset: 4px; }

  .krok {
    opacity: 0;
    transform: translateY(14px);
    animation: pridi 1.4s cubic-bezier(.2, .7, .3, 1) forwards;
  }

  .k1 { animation-delay: .4s; }
  .k2 { animation-delay: 1.7s; }
  .k3 { animation-delay: 3.1s; }
  .k4 { animation-delay: 4.4s; }

  @keyframes pridi { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .krok { animation: none; opacity: 1; transform: none; }
    .svetlo, .zrno { animation: none; }
  }
</style>
</head>
<body>

<div class="svetlo"></div>
<div class="zrno"></div>

<main class="list">
  <h1 class="nadpis krok k1">Čakajú ťa dve úlohy, ktoré musíš splniť.</h1>

  <button class="start krok k2" id="start" type="button">Začať</button>
</main>

<script>
  document.getElementById("start").onclick = function () {
    window.location.href = "kolo1.html" + location.search;
  };
</script>

</body>
</html>
